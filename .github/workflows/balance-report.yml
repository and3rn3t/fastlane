# Deterministic AI-vs-AI balance report — the full profile × rules-preset
# matrix with percentiles and goal breakdown per cell, gated on the same
# drift thresholds scripts/sim.ts already establishes. Manual for now
# (workflow_dispatch), same pattern as lighthouse.yml — no reason yet to run
# it on every push given how rarely a single commit meaningfully shifts the
# game's economy. Run it after landing a balance-relevant change (Wave 9's
# note on Real estate/Small business in particular) and read the log: some
# cells (non-Balanced profiles, non-Classic rules) are *expected* to flag by
# design — see AI_PROFILES/RULE_PRESETS — so a red run isn't itself alarming,
# it's the per-cell detail that tells you whether anything is actually new.

name: Balance Report

on:
  workflow_dispatch:
    inputs:
      gameCount:
        description: 'Games per matrix cell (12 cells total)'
        required: false
        default: '100'

permissions:
  contents: read

jobs:
  balance-report:
    name: Sim balance report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - name: Run balance report
        env:
          GAME_COUNT: ${{ inputs.gameCount }}
        run: pnpm sim:report "$GAME_COUNT"
