# Lighthouse performance baseline against the live Pages URL.
# Manual for now (workflow_dispatch) — run it after a change you expect to
# affect load performance and fix what it flags. See the reusable workflow's
# own header for the "custom build step" case this repo doesn't need.

name: Lighthouse

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse audit
    uses: and3rn3t/.github/.github/workflows/reusable-lighthouse.yml@bac71674cf57c550774f71a70e32a5bb7bec48ad # v1
    with:
      url: https://fastlane.andernet.dev
