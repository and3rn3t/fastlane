# Default: Node.js quality pipeline (matches and3rn3t repo conventions).
# Python variant at the bottom — swap the jobs if this is a Python project.
#
# Shorter alternative — call the shared reusable workflow instead:
#   jobs:
#     quality:
#       uses: and3rn3t/.github/.github/workflows/reusable-node-verify.yml@v1
#       with:
#         command: npm run lint && npm run type-check && npm test && npm run build

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Type-check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm type-check
      - name: Format check
        run: pnpm format:check
      - name: Tests with coverage
        run: pnpm test:coverage
      - name: Build
        run: pnpm build

