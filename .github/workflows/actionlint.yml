# Validate workflow YAML against the real Actions schema on every PR that
# touches .github/workflows/. See reusable-actionlint.yml.
name: Actionlint

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    uses: and3rn3t/.github/.github/workflows/reusable-actionlint.yml@e6def4b6d32f899ac29e160df9befbc04772a36b # main
