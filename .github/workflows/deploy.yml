# Build + deploy to Cloudflare Pages via the shared reusable workflow
# (and3rn3t/.github) — production deploy on push to main, preview deploy on
# PRs (skipped for Dependabot/Renovate PRs, which don't get repo secrets).
# See reusable-cloudflare-pages-deploy.yml for what this does; repo-specific
# extras (a PR comment, a one-time `pages project create` step) belong in a
# follow-up job here that `needs: deploy`, not in the reusable workflow.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# No concurrency block here on purpose: the reusable workflow below already
# declares concurrency on group `${{ github.workflow }}-${{ github.ref }}`,
# which — for a reusable-workflow call — resolves to this same caller's
# name+ref. Adding an identical block at this level makes the run wait on
# its own concurrency slot (a real deadlock GitHub detects and cancels the
# run for); neither of the two other repos actually running this reusable
# workflow (huggingface, telescope) declare one here either.

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    uses: and3rn3t/.github/.github/workflows/reusable-cloudflare-pages-deploy.yml@v1
    with:
      project-name: fastlane
      package-manager: pnpm
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
